<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 170" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111820" />
      <stop offset="100%" stop-color="#0A0E13" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16202B" />
      <stop offset="100%" stop-color="#0E161E" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#58A6FF" />
    </marker>
  </defs>

  <style>
    .mono { font-family: -apple-system, BlinkMacSystemFont, "JetBrains Mono", Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    @keyframes flow {
      0% { stroke-dashoffset: 24; }
      100% { stroke-dashoffset: 0; }
    }
    .flow-line {
      stroke-dasharray: 6 3;
      animation: flow 1.5s linear infinite;
    }
  </style>

  <!-- Container -->
  <rect width="840" height="170" rx="8" fill="url(#cardBg)" stroke="#1F2C38" stroke-width="1.2" />

  <!-- Title / Tag -->
  <text x="24" y="26" fill="#58A6FF" font-size="11" font-weight="700" class="mono" letter-spacing="1.5">PORTFLOW SBX // MARITIME PIPELINE ARCHITECTURE</text>
  <line x1="24" y1="34" x2="816" y2="34" stroke="#1A2530" stroke-width="1" />

  <!-- Node 1: AIS Data -->
  <g transform="translate(24, 52)">
    <rect width="165" height="96" rx="6" fill="url(#nodeGrad)" stroke="#263645" stroke-width="1" />
    <circle cx="16" cy="18" r="4" fill="#38BDF8" />
    <text x="26" y="21" fill="#E6EDF3" font-size="11.5" font-weight="600" class="sans">Real-Time AIS Feed</text>
    <text x="14" y="44" fill="#8B98A5" font-size="10.5" class="mono">&#8226; Vessel Telemetry</text>
    <text x="14" y="60" fill="#8B98A5" font-size="10.5" class="mono">&#8226; SOG / COG / Heading</text>
    <text x="14" y="76" fill="#8B98A5" font-size="10.5" class="mono">&#8226; Dynamic Geopoint Stream</text>
    <rect x="14" y="84" width="70" height="4" rx="2" fill="#38BDF8" opacity="0.6" />
  </g>

  <!-- Flow Line 1 -> 2 -->
  <line x1="190" y1="100" x2="226" y2="100" stroke="#58A6FF" stroke-width="2" marker-end="url(#arrow)" class="flow-line" />

  <!-- Node 2: PostgreSQL & Spatial Engine -->
  <g transform="translate(230, 52)">
    <rect width="175" height="96" rx="6" fill="url(#nodeGrad)" stroke="#263645" stroke-width="1" />
    <circle cx="16" cy="18" r="4" fill="#58A6FF" />
    <text x="26" y="21" fill="#E6EDF3" font-size="11.5" font-weight="600" class="sans">PostgreSQL / Spatial</text>
    <text x="14" y="44" fill="#8B98A5" font-size="10.5" class="mono">&#8226; Spatial Indexing</text>
    <text x="14" y="60" fill="#8B98A5" font-size="10.5" class="mono">&#8226; Anchorage Clustering</text>
    <text x="14" y="76" fill="#8B98A5" font-size="10.5" class="mono">&#8226; Port Congestion Index</text>
    <rect x="14" y="84" width="70" height="4" rx="2" fill="#58A6FF" opacity="0.6" />
  </g>

  <!-- Flow Line 2 -> 3 -->
  <line x1="406" y1="100" x2="442" y2="100" stroke="#58A6FF" stroke-width="2" marker-end="url(#arrow)" class="flow-line" />

  <!-- Node 3: Scenario & Analytics Engine -->
  <g transform="translate(446, 52)">
    <rect width="175" height="96" rx="6" fill="url(#nodeGrad)" stroke="#263645" stroke-width="1" />
    <circle cx="16" cy="18" r="4" fill="#2DD4BF" />
    <text x="26" y="21" fill="#E6EDF3" font-size="11.5" font-weight="600" class="sans">Scenario &amp; ETA Engine</text>
    <text x="14" y="44" fill="#8B98A5" font-size="10.5" class="mono">&#8226; Berth Wait Modeling</text>
    <text x="14" y="60" fill="#8B98A5" font-size="10.5" class="mono">&#8226; ETA Disruption Analysis</text>
    <text x="14" y="76" fill="#8B98A5" font-size="10.5" class="mono">&#8226; Route Risk Evaluation</text>
    <rect x="14" y="84" width="70" height="4" rx="2" fill="#2DD4BF" opacity="0.6" />
  </g>

  <!-- Flow Line 3 -> 4 -->
  <line x1="622" y1="100" x2="658" y2="100" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arrow)" class="flow-line" />

  <!-- Node 4: Command Center UI -->
  <g transform="translate(662, 52)">
    <rect width="154" height="96" rx="6" fill="url(#nodeGrad)" stroke="#2DD4BF" stroke-width="1" />
    <circle cx="16" cy="18" r="4" fill="#2DD4BF" />
    <text x="26" y="21" fill="#E6EDF3" font-size="11.5" font-weight="600" class="sans">Command Center UI</text>
    <text x="14" y="44" fill="#8B98A5" font-size="10.5" class="mono">&#8226; Interactive Maps</text>
    <text x="14" y="60" fill="#8B98A5" font-size="10.5" class="mono">&#8226; Vessel Drill-down</text>
    <text x="14" y="76" fill="#8B98A5" font-size="10.5" class="mono">&#8226; Operational Decisions</text>
    <rect x="14" y="84" width="70" height="4" rx="2" fill="#2DD4BF" opacity="0.6" />
  </g>
</svg>
