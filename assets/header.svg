<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D10" />
      <stop offset="50%" stop-color="#0D1318" />
      <stop offset="100%" stop-color="#090D10" />
    </linearGradient>

    <linearGradient id="panelGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12181F" />
      <stop offset="100%" stop-color="#0B0F13" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#303E4D" />
      <stop offset="50%" stop-color="#1E2832" />
      <stop offset="100%" stop-color="#151D24" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#16202A" stroke-width="0.7" opacity="0.6" />
    </pattern>
  </defs>

  <style>
    .font-mono {
      font-family: -apple-system, BlinkMacSystemFont, "JetBrains Mono", "Fira Code", "SF Mono", Consolas, monospace;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    @keyframes cursor-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .status-dot {
      animation: pulse-dot 2.5s ease-in-out infinite;
      transform-origin: 32px 25px;
    }
    .cursor {
      animation: cursor-blink 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>

  <!-- Canvas Outer Background -->
  <rect width="900" height="330" rx="14" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="1.5" />
  
  <!-- Subtle Ambient Grid -->
  <rect x="2" y="2" width="896" height="326" rx="12" fill="url(#grid)" opacity="0.75" />

  <!-- Top Decorative Accent Bar -->
  <rect x="30" y="0" width="840" height="2" fill="url(#accentGradient)" opacity="0.8" />

  <!-- Terminal Top Bar -->
  <g transform="translate(0, 0)">
    <rect x="2" y="2" width="896" height="46" rx="12" fill="#0C1116" opacity="0.9" />
    <line x1="2" y1="48" x2="898" y2="48" stroke="#1D2833" stroke-width="1" />
    
    <!-- System Status Indicator -->
    <circle class="status-dot" cx="32" cy="25" r="4.5" fill="#2DD4BF" />
    <circle cx="32" cy="25" r="7" fill="none" stroke="#2DD4BF" stroke-width="0.8" opacity="0.4" />
    
    <text x="48" y="29" fill="#2DD4BF" font-size="11" font-weight="600" class="font-mono" letter-spacing="1">SYSTEM OPERATIONAL</text>
    <text x="195" y="29" fill="#5A6E82" font-size="11" class="font-mono">//</text>
    <text x="212" y="29" fill="#8B98A5" font-size="11" class="font-mono">NODE: IN-WEST-1</text>
    
    <!-- Coordinates / University Badge -->
    <rect x="620" y="14" width="250" height="22" rx="4" fill="#141C24" stroke="#233240" stroke-width="0.8" />
    <text x="632" y="29" fill="#58A6FF" font-size="10.5" font-weight="600" class="font-mono" letter-spacing="0.5">CHARUSAT :: B.TECH CE [YR 3]</text>
  </g>

  <!-- Left Column: Identity & Branding -->
  <g transform="translate(36, 75)">
    <!-- Small Tag -->
    <text x="0" y="18" fill="#58A6FF" font-size="11.5" font-weight="600" class="font-mono" letter-spacing="2">DEVELOPER PORTFOLIO</text>
    
    <!-- Main Name -->
    <text x="0" y="62" fill="#E6EDF3" font-size="38" font-weight="800" class="font-sans" letter-spacing="-0.5">Om Mistry</text>
    
    <!-- Role & Positioning -->
    <text x="0" y="92" fill="#8B98A5" font-size="14.5" font-weight="500" class="font-sans">
      Computer Engineering Student · Full-Stack · AI/ML
    </text>

    <!-- Bio Summary -->
    <text x="0" y="122" fill="#768493" font-size="12.5" class="font-sans">
      Engineering practical web applications, multilingual NLP models,
    </text>
    <text x="0" y="140" fill="#768493" font-size="12.5" class="font-sans">
      and maritime intelligence systems from database to user interface.
    </text>

    <!-- Status Badges -->
    <g transform="translate(0, 168)">
      <!-- Badge 1: Focus -->
      <rect x="0" y="0" width="135" height="26" rx="5" fill="#111921" stroke="#223242" stroke-width="1" />
      <circle cx="12" cy="13" r="3" fill="#58A6FF" />
      <text x="22" y="17" fill="#C9D1D9" font-size="11" font-weight="500" class="font-sans">Full-Stack &amp; AI/ML</text>

      <!-- Badge 2: Open Source -->
      <rect x="145" y="0" width="128" height="26" rx="5" fill="#111921" stroke="#223242" stroke-width="1" />
      <circle cx="157" cy="13" r="3" fill="#2DD4BF" />
      <text x="167" y="17" fill="#C9D1D9" font-size="11" font-weight="500" class="font-sans">Project Builder</text>

      <!-- Badge 3: CHARUSAT -->
      <rect x="283" y="0" width="102" height="26" rx="5" fill="#111921" stroke="#223242" stroke-width="1" />
      <circle cx="295" cy="13" r="3" fill="#A371F7" />
      <text x="305" y="17" fill="#C9D1D9" font-size="11" font-weight="500" class="font-sans">Third Year</text>
    </g>
  </g>

  <!-- Right Column: Interactive-looking Terminal Screen -->
  <g transform="translate(470, 70)">
    <!-- Terminal Box -->
    <rect width="398" height="225" rx="8" fill="url(#panelGradient)" stroke="#1F2A35" stroke-width="1" />
    
    <!-- Inner subtle glow -->
    <rect x="1" y="1" width="396" height="223" rx="7" fill="none" stroke="#2A3947" stroke-width="0.5" opacity="0.4" />
    
    <!-- Terminal Header Bar -->
    <rect x="0" y="0" width="398" height="28" rx="8" fill="#141B22" />
    <path d="M 0 20 L 0 28 L 398 28 L 398 20 Z" fill="#141B22" />
    <line x1="0" y1="28" x2="398" y2="28" stroke="#1D2833" stroke-width="1" />
    
    <!-- Window controls -->
    <circle cx="16" cy="14" r="4" fill="#ED6A5E" />
    <circle cx="29" cy="14" r="4" fill="#F4BF4F" />
    <circle cx="42" cy="14" r="4" fill="#61C554" />
    
    <text x="200" y="18" text-anchor="middle" fill="#586A7D" font-size="10.5" font-weight="500" class="font-mono">om@dev-station:~</text>

    <!-- Terminal Content Lines -->
    <g transform="translate(18, 48)">
      <!-- Line 1: whoami -->
      <text x="0" y="0" fill="#58A6FF" font-size="12" font-weight="600" class="font-mono">$</text>
      <text x="14" y="0" fill="#E6EDF3" font-size="12" class="font-mono">whoami</text>
      <text x="0" y="18" fill="#8B98A5" font-size="11.5" class="font-mono">om_mistry // 3rd Year B.Tech CE @ CHARUSAT</text>

      <!-- Line 2: focus -->
      <text x="0" y="44" fill="#58A6FF" font-size="12" font-weight="600" class="font-mono">$</text>
      <text x="14" y="44" fill="#E6EDF3" font-size="12" class="font-mono">cat /etc/focus</text>
      <text x="0" y="62" fill="#2DD4BF" font-size="11.5" class="font-mono">&#8594; Web Apps (React · Next.js · Node · Postgres)</text>
      <text x="0" y="79" fill="#2DD4BF" font-size="11.5" class="font-mono">&#8594; AI/ML &amp; NLP (Multilingual QA · SLMs)</text>

      <!-- Line 3: flagship systems -->
      <text x="0" y="105" fill="#58A6FF" font-size="12" font-weight="600" class="font-mono">$</text>
      <text x="14" y="105" fill="#E6EDF3" font-size="12" class="font-mono">ls active-projects/</text>
      <text x="0" y="123" fill="#D2A8FF" font-size="11.5" class="font-mono">PortFlow-SBX/  IndicQA/  CreditFlow/  TRACKIFY/</text>

      <!-- Line 4: ethos with blinking cursor -->
      <text x="0" y="149" fill="#58A6FF" font-size="12" font-weight="600" class="font-mono">$</text>
      <text x="14" y="149" fill="#8B98A5" font-size="11.5" class="font-mono">echo $ETHOS</text>
      <text x="0" y="167" fill="#E6EDF3" font-size="11.5" font-weight="600" class="font-mono">Build &#8594; Learn &#8594; Improve &#8594; Repeat</text>
      <rect class="cursor" x="250" y="156" width="7" height="13" rx="1" fill="#58A6FF" />
    </g>
  </g>

  <!-- Bottom Accent Status Bar -->
  <g transform="translate(36, 310)">
    <circle cx="4" cy="0" r="2.5" fill="#58A6FF" />
    <text x="14" y="3" fill="#506173" font-size="10" class="font-mono" letter-spacing="0.5">GUJARAT, INDIA</text>
    <text x="120" y="3" fill="#324354" font-size="10" class="font-mono">|</text>
    <text x="135" y="3" fill="#506173" font-size="10" class="font-mono" letter-spacing="0.5">LATENCY: 18ms</text>
    <text x="235" y="3" fill="#324354" font-size="10" class="font-mono">|</text>
    <text x="250" y="3" fill="#506173" font-size="10" class="font-mono" letter-spacing="0.5">STACK: TYPESCRIPT · PYTHON · POSTGRES</text>
  </g>
</svg>
