<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1317" />
      <stop offset="100%" stop-color="#080C0F" />
    </linearGradient>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3B47" />
      <stop offset="50%" stop-color="#1B242D" />
      <stop offset="100%" stop-color="#12181E" />
    </linearGradient>
  </defs>

  <style>
    .mono {
      font-family: -apple-system, BlinkMacSystemFont, "JetBrains Mono", "Fira Code", monospace;
    }
    @keyframes term-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .term-cursor {
      animation: term-blink 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>

  <!-- Outer Window -->
  <rect width="860" height="410" rx="10" fill="url(#termBg)" stroke="url(#termBorder)" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <rect x="0" y="0" width="860" height="34" rx="10" fill="#141B22" />
  <path d="M 0 24 L 0 34 L 860 34 L 860 24 Z" fill="#141B22" />
  <line x1="0" y1="34" x2="860" y2="34" stroke="#202A33" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="20" cy="17" r="4.5" fill="#ED6A5E" />
  <circle cx="36" cy="17" r="4.5" fill="#F4BF4F" />
  <circle cx="52" cy="17" r="4.5" fill="#61C554" />

  <!-- Window Title -->
  <text x="430" y="21" text-anchor="middle" fill="#7A8B9C" font-size="11.5" font-weight="500" class="mono">ommistry@workstation: ~/telemetry/status.json</text>

  <!-- Shell Prompt -->
  <g transform="translate(24, 60)">
    <text x="0" y="0" fill="#2DD4BF" font-size="12.5" font-weight="600" class="mono">&#10132;</text>
    <text x="18" y="0" fill="#58A6FF" font-size="12.5" font-weight="600" class="mono">~</text>
    <text x="32" y="0" fill="#E6EDF3" font-size="12.5" class="mono">om --status --inspect</text>
  </g>

  <!-- JSON Payload Output -->
  <g transform="translate(24, 88)" font-size="12" class="mono">
    <!-- Opening brace -->
    <text x="0" y="0" fill="#E6EDF3">{</text>

    <!-- identity -->
    <text x="20" y="20" fill="#7EE787">"identity"</text>
    <text x="100" y="20" fill="#8B98A5">:</text>
    <text x="115" y="20" fill="#A5D6FF">"Om Mistry"</text>
    <text x="200" y="20" fill="#8B98A5">,</text>

    <!-- role -->
    <text x="20" y="38" fill="#7EE787">"academic"</text>
    <text x="100" y="38" fill="#8B98A5">:</text>
    <text x="115" y="38" fill="#A5D6FF">"3rd Year B.Tech in Computer Engineering @ CHARUSAT"</text>
    <text x="540" y="38" fill="#8B98A5">,</text>

    <!-- focus -->
    <text x="20" y="56" fill="#7EE787">"domains"</text>
    <text x="100" y="56" fill="#8B98A5">:</text>
    <text x="115" y="56" fill="#8B98A5">[</text>
    <text x="125" y="56" fill="#FFA657">"Full-Stack Web Systems"</text>
    <text x="300" y="56" fill="#8B98A5">, </text>
    <text x="315" y="56" fill="#FFA657">"Applied AI/ML &amp; NLP"</text>
    <text x="475" y="56" fill="#8B98A5">, </text>
    <text x="490" y="56" fill="#FFA657">"Data Engineering"</text>
    <text x="635" y="56" fill="#8B98A5">],</text>

    <!-- core_stack -->
    <text x="20" y="76" fill="#7EE787">"core_stack"</text>
    <text x="110" y="76" fill="#8B98A5">: {</text>
    <text x="40" y="94" fill="#79C0FF">"languages"</text>
    <text x="135" y="94" fill="#8B98A5">:</text>
    <text x="150" y="94" fill="#A5D6FF">["TypeScript", "JavaScript", "Python", "C++", "Java", "SQL"]</text>
    <text x="590" y="94" fill="#8B98A5">,</text>

    <text x="40" y="112" fill="#79C0FF">"fullstack"</text>
    <text x="135" y="112" fill="#8B98A5">:</text>
    <text x="150" y="112" fill="#A5D6FF">["React", "Next.js", "Node.js", "Express", "Tailwind CSS", "Prisma"]</text>
    <text x="645" y="112" fill="#8B98A5">,</text>

    <text x="40" y="130" fill="#79C0FF">"databases"</text>
    <text x="135" y="130" fill="#8B98A5">:</text>
    <text x="150" y="130" fill="#A5D6FF">["PostgreSQL", "MySQL", "Supabase"]</text>
    <text x="400" y="130" fill="#8B98A5">,</text>

    <text x="40" y="148" fill="#79C0FF">"ai_nlp"</text>
    <text x="135" y="148" fill="#8B98A5">:</text>
    <text x="150" y="148" fill="#A5D6FF">["scikit-learn", "Sentence-Transformers", "Small Language Models (SLMs)"]</text>
    <text x="20" y="166" fill="#8B98A5">},</text>

    <!-- flagship_systems -->
    <text x="20" y="186" fill="#7EE787">"flagship_systems"</text>
    <text x="165" y="186" fill="#8B98A5">: [</text>
    
    <text x="40" y="204" fill="#D2A8FF">"PortFlow SBX"</text>
    <text x="150" y="204" fill="#6E7681">// Maritime AIS Congestion Intelligence &amp; Map Engine</text>
    <text x="545" y="204" fill="#8B98A5">,</text>

    <text x="40" y="222" fill="#D2A8FF">"IndicQA"</text>
    <text x="150" y="222" fill="#6E7681">// 11-Language Multilingual &amp; Code-Mixed SLM QA</text>
    <text x="485" y="222" fill="#8B98A5">,</text>

    <text x="40" y="240" fill="#D2A8FF">"CreditFlow Pro"</text>
    <text x="165" y="240" fill="#6E7681">// B2B Cash-Flow &amp; Invoicing Platform (Live on Netlify)</text>
    <text x="545" y="240" fill="#8B98A5">,</text>

    <text x="40" y="258" fill="#D2A8FF">"TRACKIFY"</text>
    <text x="150" y="258" fill="#6E7681">// Full-Stack Expense Management &amp; Analytics</text>

    <text x="20" y="276" fill="#8B98A5">],</text>

    <!-- ethos -->
    <text x="20" y="294" fill="#7EE787">"engineering_ethos"</text>
    <text x="175" y="294" fill="#8B98A5">:</text>
    <text x="190" y="294" fill="#2DD4BF">"Build &#8594; Learn &#8594; Improve &#8594; Repeat"</text>

    <!-- Closing brace -->
    <text x="0" y="312" fill="#E6EDF3">}</text>
  </g>

  <!-- Prompt Cursor at Bottom -->
  <g transform="translate(24, 400)">
    <!-- Terminal Prompt Line -->
    <text x="0" y="-8" fill="#2DD4BF" font-size="12" font-weight="600" class="mono">&#10132;</text>
    <text x="18" y="-8" fill="#58A6FF" font-size="12" font-weight="600" class="mono">~</text>
    <text x="32" y="-8" fill="#8B98A5" font-size="12" class="mono">ready_for_collaboration=true</text>
    <rect class="term-cursor" x="245" y="-18" width="7" height="13" rx="1" fill="#58A6FF" />
  </g>
</svg>
