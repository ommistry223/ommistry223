name: Update Profile Telemetry & Snake Animation

on:
  schedule:
    # Run every 24 hours at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Contribution Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ommistry223
          outputs: |
            assets/github-contribution-grid-snake.svg?color_snake=#2DD4BF&color_dots=#141C24,#162D4A,#1B4B7E,#286BB3,#58A6FF
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#2DD4BF&color_dots=#141C24,#162D4A,#1B4B7E,#286BB3,#58A6FF

      - name: Commit and Push Updated Animation
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/github-contribution-grid-snake*.svg
          if git diff --staged --quiet; then
            echo "No contribution changes detected."
          else
            git commit -m "chore(telemetry): refresh contribution grid snake [skip ci]"
            git push
          fi
